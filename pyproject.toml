[project]
name = "synthetic-dataset-generation-suite"
version = "0.1.0"
description = "Multi-provider synthetic reasoning dataset generation pipeline"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pyyaml",
    "click",
    "datasets",
    "arxiv",
    "semanticscholar",
    "pymupdf",
    "requests",
]

[project.optional-dependencies]
gpu = ["pynvml"]
dev = ["pytest", "ruff"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "cryptography>=41.0",
    "huggingface_hub>=0.20",
    "anthropic>=0.40",
    "wandb>=0.16",
]
loop = [
    "langchain>=0.3",
    "langchain-ollama>=0.3",
    "langgraph>=0.2",
    "lm-eval>=0.4",
    "sentence-transformers>=3.0",
    "accelerate>=1.0",
    "peft>=0.13",
]

[tool.setuptools.packages.find]
include = ["sdgs*"]

[project.scripts]
sdgs = "sdgs.cli:cli"
