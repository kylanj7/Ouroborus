gate:
  improvement_threshold: 0.5
  fail_cap: 3
  alert_email: "kylan.ml.ai@gmail.com"
  smtp_host: "smtp.gmail.com"
  smtp_port: 587

training:
  strategy: "merge-and-continue"
  base_model: "Qwen/Qwen3.5-9B"
  preserve_original: true
  model_config: "qwen3.5-9b"
  training_config: "default"
  checkpoint_dir: "models/merged/"
  max_checkpoints: 5

benchmarks:
  suites:
    - arc_challenge
    - mmlu_college_physics
    - mmlu_conceptual_physics
  batch_size: 4

tally:
  model: "gpt-oss:120b"
  provider: "ollama"
  max_clusters: 10
  history_window: 5
  max_retries: 3
  max_tool_calls: 20
  timeout_seconds: 600

curation:
  model: "gpt-oss:120b"
  provider: "ollama"
  min_pairs_per_cycle: 1000
  max_pairs_per_cycle: -1
  format: "chain-of-thought"
  max_retries_per_pair: 3
  verification:
    citation_matching: true
    entailment_model: "facebook/bart-large-mnli"
    entailment_min_ratio: 0.5
    embedding_model: "all-MiniLM-L6-v2"
    chunk_similarity_threshold: 0.3
    rejects_log: "curation_rejects.jsonl"

retrieval:
  sources:
    - semantic_scholar
    - arxiv
    - openalex
    - core
  max_papers_per_cluster: 10

logging:
  cycle_log: "loop_log.jsonl"
  project_log: "loop_projects.json"
  log_dir: "logs/loop/"

termination:
  target_score: 85.0
  max_cycles: 50
